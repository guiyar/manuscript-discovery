# Per-text typesetting settings, keyed by the eBible id (the "<id>" in "<id>_usfx.zip").
# Any *_usfx.zip in the data directory is offered even without an entry here; entries only
# improve its display name, hyphenation language and fonts.
#
# lang      Language for hyphenation and line breaking; guessed from the id prefix if omitted.
#           Use ISO 639-1 where one exists: Typst has hyphenation patterns for "en", "de",
#           "el" ... but not for "eng" or "grc".
# font      Font families in priority order. For CJK put the CJK font FIRST, otherwise the
#           Latin font's narrow punctuation wins over proper full-width punctuation.
# region    Optional; "cn" / "tw" to select regional glyph variants.

[defaults]
font = ["Libertinus Serif"]
justify = true
hyphenate = true
cjk = false

[texts.eng-kjv2006]
name = "King James Version"
lang = "en"

# "el" is used for all Greek texts: Typst has no "grc" hyphenation patterns, but the Greek
# ones hyphenate polytonic text correctly. Libertinus Serif covers polytonic Greek.
[texts.grctr]
name = "Textus Receptus"
lang = "el"

[texts.grcmt]
name = "Greek Majority Text NT"
lang = "el"

[texts.grcsbl]
name = "SBL Greek New Testament"
lang = "el"

[texts.ind]
name = "Alkitab Terjemahan Sederhana Indonesia, Edisi Ketiga"
name_eb = "Indonesian Bible (TSI)"
lang = "id"

# Check which script these two use and change the font family (SC/TC) and region to match.
[texts.cmn-cu89s]
name = "新标点和合本"
name_en = "Chinese Union Version (simplified)"
lang = "zh"
region = "cn"
font = ["Noto Serif CJK SC", "Libertinus Serif"]
hyphenate = false
cjk = true

[texts.cmnfeb]
name = "免费的易读圣经"
name_en = "Free Easy-to-read Bible"
lang = "zh"
region = "cn"
font = ["Noto Serif CJK SC", "Libertinus Serif"]
hyphenate = false
cjk = true

[texts.cmncbs]
name = "圣经当代译本开放资源"
name_en = "Mandarin Chinese Open Contemporary Bible (Simplified)"
lang = "zh"
region = "cn"
font = ["Noto Serif CJK SC", "Libertinus Serif"]
hyphenate = false
cjk = true
