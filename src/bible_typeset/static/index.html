<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scripture typesetter</title>
<style>
  :root {
    --desk: #dfe3e8;
    --panel: #ffffff;
    --ink: #1c2230;
    --muted: #5a6475;
    --line: #c9cfd8;
    --accent: #234e70;
    --accent-ink: #ffffff;
    --error: #a3262a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #14171d; --panel: #1d222b; --ink: #e8ebf0; --muted: #9aa3b2;
      --line: #343b48; --accent: #7fb0d6; --accent-ink: #0f1722; --error: #ff8a8d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 var(--sans); color: var(--ink); background: var(--desk); }
  .app { display: grid; grid-template-columns: 22rem 1fr; height: 100%; }
  form { background: var(--panel); border-right: 1px solid var(--line); padding: 1.5rem 1.4rem; overflow-y: auto; }
  h1 { font: 600 1.5rem/1.15 var(--serif); margin: 0 0 1.4rem; letter-spacing: .01em; }
  fieldset { border: 0; padding: 0; margin: 0 0 1.2rem; }
  legend { font-weight: 600; padding: 0; margin-bottom: .5rem; }
  label { display: block; color: var(--muted); font-size: .85rem; margin: .6rem 0 .2rem; }
  select, input[type=number], input[type=text] {
    width: 100%; font: inherit; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 4px; padding: .45rem .55rem;
  }
  .pair { display: grid; grid-template-columns: 1fr 5.5rem; gap: .5rem; }
  .pair label { margin-top: 0; }
  details { margin-bottom: 1.2rem; border-top: 1px solid var(--line); padding-top: .8rem; }
  summary { cursor: pointer; font-weight: 600; }
  .check { display: flex; gap: .5rem; align-items: center; color: var(--ink); margin-top: .9rem; }
  .actions { display: grid; gap: .5rem; }
  button { font: inherit; border-radius: 4px; padding: .6rem .9rem; cursor: pointer; border: 1px solid var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .55; cursor: progress; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
  main { display: flex; flex-direction: column; min-width: 0; padding: 1rem 1.4rem 1.4rem; gap: .6rem; }
  #status { min-height: 1.4rem; color: var(--muted); }
  #status.error { color: var(--error); font-weight: 600; }
  .sheet { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line); }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #text { margin: 0; height: 100%; overflow: auto; padding: 2rem clamp(1rem, 6vw, 5rem);
          font: 1.05rem/1.6 var(--serif); white-space: pre-wrap; }
  .empty { height: 100%; display: grid; place-content: center; text-align: center; color: var(--muted); padding: 2rem; }
  .empty p { max-width: 28rem; margin: 0; font: 1.1rem/1.5 var(--serif); }
  [hidden] { display: none !important; }
  @media (max-width: 52rem) {
    .app { grid-template-columns: 1fr; height: auto; }
    form { border-right: 0; border-bottom: 1px solid var(--line); }
    .sheet { min-height: 70vh; }
  }
</style>
</head>
<body>
<div class="app">
  <form id="form" autocomplete="off">
    <h1>Scripture typesetter</h1>

    <fieldset>
      <legend>Text</legend>
      <label for="t1">Translation</label>
      <select id="t1" required></select>
      <label for="t2">Parallel translation</label>
      <select id="t2"><option value="">None</option></select>
    </fieldset>

    <fieldset>
      <legend>Passage</legend>
      <label for="book">Book</label>
      <select id="book" required></select>
      <label>From</label>
      <div class="pair">
        <div><select id="c1" aria-label="From chapter"></select></div>
        <input id="v1" type="number" min="1" aria-label="From verse">
      </div>
      <label>To</label>
      <div class="pair">
        <div><select id="c2" aria-label="To chapter"></select></div>
        <input id="v2" type="number" min="1" aria-label="To verse">
      </div>
    </fieldset>

    <details>
      <summary>Page options</summary>
      <label for="paper">Paper</label>
      <select id="paper">
        <option value="a4">A4</option><option value="a5">A5</option>
        <option value="a6">A6</option><option value="us-letter">US Letter</option>
      </select>
      <label for="size">Font size (pt)</label>
      <input id="size" type="number" min="8" max="16" step="0.5" value="11">
      <label for="title">Title (leave empty for the passage reference)</label>
      <input id="title" type="text" maxlength="200">
      <label class="check"><input id="names" type="checkbox" checked> Show translation names</label>
    </details>

    <div class="actions">
      <button class="primary" type="submit" id="preview">Preview PDF</button>
      <button class="secondary" type="button" id="download">Download PDF</button>
      <button class="secondary" type="button" id="plain">Show plain text</button>
    </div>
  </form>

  <main>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="sheet">
      <div class="empty" id="empty"><p>Choose a passage, then preview it as a typeset page.</p></div>
      <iframe id="pdf" title="PDF preview" hidden></iframe>
      <pre id="text" hidden></pre>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const outlines = {};
let current = [];          // outline of the selected book in the primary text
let blobUrl = null;

const outline = async (id) =>
  outlines[id] ??= await fetch(`/api/texts/${id}/outline`).then((r) => r.json());

const options = (el, items, keep) => {
  el.replaceChildren(...items.map(([v, label]) => new Option(label, v)));
  if (keep && items.some(([v]) => v === keep)) el.value = keep;
};

function status(msg, isError = false) {
  const el = $("status");
  el.textContent = msg;
  el.classList.toggle("error", isError);
}

async function loadTexts() {
  const texts = await fetch("/api/texts").then((r) => r.json());
  if (!texts.length) return status("No texts found. Put eBible *_usfx.zip files in the data directory.", true);
  options($("t1"), texts.map((t) => [t.id, t.name]));
  options($("t2"), [["", "None"], ...texts.map((t) => [t.id, t.name])]);
  await loadBooks();
}

async function loadBooks() {
  const ids = [$("t1").value, $("t2").value].filter(Boolean);
  status("Loading text…");
  const outs = await Promise.all(ids.map(outline));
  const shared = outs[0].filter((b) => outs.every((o) => o.some((x) => x.code === b.code)));
  options($("book"), shared.map((b) => [b.code, b.name]), $("book").value);
  status("");
  setBook();
}

function setBook() {
  current = outlines[$("t1").value]?.find((b) => b.code === $("book").value)?.verses ?? [];
  const chapters = current.map((_, i) => [String(i + 1), String(i + 1)]);
  options($("c1"), chapters);
  options($("c2"), chapters);
  $("c1").value = $("c2").value = "1";
  fromChanged(true);
  toChanged(true);
}

function fromChanged(reset) {
  const c = +$("c1").value;
  $("v1").max = current[c - 1] || 1;
  if (reset) $("v1").value = 1;
  if (+$("c2").value < c) { $("c2").value = c; toChanged(true); }
}
function toChanged(reset) {
  const c = +$("c2").value;
  $("v2").max = current[c - 1] || 1;
  if (reset) $("v2").value = current[c - 1] || 1;
}

function query(format, download = false) {
  const p = new URLSearchParams();
  p.append("text", $("t1").value);
  if ($("t2").value) p.append("text", $("t2").value);
  for (const k of ["book", "c1", "v1", "c2", "v2", "paper", "size"]) p.set(k, $(k).value);
  if ($("title").value.trim()) p.set("title", $("title").value.trim());
  p.set("label", $("names").checked);
  p.set("format", format);
  if (download) p.set("download", "true");
  return p;
}

async function fetchDoc(format, download = false) {
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  status(format === "pdf" ? "Typesetting…" : "Preparing text…");
  try {
    const res = await fetch(`/api/render?${query(format, download)}`);
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      const msg = Array.isArray(detail.detail) ? detail.detail.map((d) => d.msg).join("; ") : detail.detail;
      throw new Error(msg || `Request failed (${res.status})`);
    }
    status("");
    return res;
  } catch (e) {
    status(e.message, true);
    return null;
  } finally {
    document.querySelectorAll("button").forEach((b) => (b.disabled = false));
  }
}

const show = (which) => {
  for (const id of ["empty", "pdf", "text"]) $(id).hidden = id !== which;
};

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const res = await fetchDoc("pdf");
  if (!res) return;
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(await res.blob());
  $("pdf").src = blobUrl;
  show("pdf");
});

$("download").addEventListener("click", async () => {
  const res = await fetchDoc("pdf", true);
  if (!res) return;
  const name = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "")?.[1] || "passage.pdf";
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await res.blob()), download: name });
  a.click();
  URL.revokeObjectURL(a.href);
});

$("plain").addEventListener("click", async () => {
  const res = await fetchDoc("txt");
  if (!res) return;
  $("text").textContent = await res.text();
  show("text");
});

$("t1").addEventListener("change", loadBooks);
$("t2").addEventListener("change", loadBooks);
$("book").addEventListener("change", setBook);
$("c1").addEventListener("change", () => fromChanged(true));
$("c2").addEventListener("change", () => toChanged(true));

loadTexts().catch((e) => status(e.message, true));
</script>
</body>
</html>
