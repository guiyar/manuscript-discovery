<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manuscript Discovery</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-desk font-serif text-ink">
<div class="flex h-full flex-col md:flex-row">

  <!-- Small screens: a slim bar with the menu button. The form below becomes its drawer. -->
  <div class="flex shrink-0 items-center justify-between border-b border-line bg-panel px-4 py-2 md:hidden">
    <p class="small-caps text-lg font-semibold tracking-wide">Manuscript Discovery</p>
    <button type="button" id="menu" aria-controls="form" aria-expanded="false" class="btn btn-secondary gap-2 px-3 py-1.5"><svg class="size-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>Settings</button>
  </div>
  <div id="backdrop" hidden class="fixed inset-0 z-40 bg-ink/50 md:hidden"></div>

  <!-- Passage, translations and settings: a sidebar, or on small screens a drawer -->
  <form id="form" autocomplete="off" aria-label="Passage and settings" class="invisible fixed inset-y-0 left-0 z-50 w-[min(24rem,90vw)] -translate-x-full space-y-6 overflow-y-auto border-r border-line bg-panel p-6 transition-[translate,visibility] duration-200 motion-reduce:transition-none data-open:visible data-open:translate-x-0 data-open:shadow-2xl md:visible md:static md:z-auto md:w-96 md:shrink-0 md:translate-x-0 md:shadow-none">
    <header class="flex items-start justify-between gap-4">
      <div>
        <h1 class="small-caps text-2xl leading-tight font-semibold tracking-wide">Manuscript Discovery</h1>
        <p class="mt-1 text-sm text-muted italic">Biblical passages set as clean manuscripts for study.</p>
      </div>
      <button type="button" id="closeMenu" aria-label="Close settings" class="btn btn-secondary -mt-1 -mr-2 p-2 md:hidden"><svg class="size-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </header>

    <fieldset class="space-y-4">
      <legend class="heading mb-3">Passage</legend>
      <div>
        <label for="book" class="label">Book</label>
        <select id="book" class="input"></select>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="c1" class="label">From chapter</label>
          <select id="c1" class="input"></select>
        </div>
        <div>
          <label for="v1" class="label">From verse</label>
          <select id="v1" class="input"></select>
        </div>
        <div>
          <label for="c2" class="label">To chapter</label>
          <select id="c2" class="input"></select>
        </div>
        <div>
          <label for="v2" class="label">To verse</label>
          <select id="v2" class="input"></select>
        </div>
      </div>
    </fieldset>

    <fieldset class="space-y-4">
      <legend class="heading mb-3">Translation</legend>
      <div class="relative">
        <label for="t1" class="label">Search by name or language</label>
        <input id="t1" type="text" role="combobox" aria-expanded="false" aria-controls="t1-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" class="input" placeholder="Choose a translation">
        <div id="t1-list" role="listbox" aria-label="Translations by language" hidden class="absolute inset-x-0 top-full z-20 mt-1 max-h-72 overflow-y-auto rounded-md border border-line bg-panel shadow-lg"></div>
      </div>
      <div class="relative">
        <label for="t2" class="label">Parallel translation (optional)</label>
        <input id="t2" type="text" role="combobox" aria-expanded="false" aria-controls="t2-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" class="input" placeholder="None">
        <div id="t2-list" role="listbox" aria-label="Translations by language" hidden class="absolute inset-x-0 top-full z-20 mt-1 max-h-72 overflow-y-auto rounded-md border border-line bg-panel shadow-lg"></div>
      </div>
    </fieldset>

    <div id="problems" role="status" aria-live="polite" hidden class="rounded-md border border-l-4 border-error bg-error/10 p-3 text-sm text-ink"></div>

    <button type="button" id="download" class="btn btn-primary w-full max-md:hidden">Download PDF</button>

    <details open class="group/settings border-t border-line pt-4">
      <summary class="heading flex cursor-pointer list-none items-center gap-2 [&::-webkit-details-marker]:hidden"><svg class="size-4 shrink-0 transition-transform group-open/settings:rotate-90" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>Settings</summary>
      <div class="mt-4 space-y-4">
        <label class="flex items-start gap-3 text-sm">
          <input id="paragraphs" type="checkbox" class="mt-0.5 size-4 accent-accent">
          <span><span class="font-medium">Paragraph breaks</span><span class="block text-muted">Off: continuous text. On: where the translation marks them.</span></span>
        </label>
        <label class="flex items-start gap-3 text-sm">
          <input id="poetry" type="checkbox" class="mt-0.5 size-4 accent-accent" checked>
          <span><span class="font-medium">Poetry lines</span><span class="block text-muted">Only where the translation marks them.</span></span>
        </label>
        <label class="flex items-start gap-3 text-sm">
          <input id="line_numbers" type="checkbox" class="mt-0.5 size-4 accent-accent" checked>
          <span><span class="font-medium">Line numbers</span><span class="block text-muted">Restart each page; first translation only when parallel.</span></span>
        </label>
        <div class="space-y-3">
          <label class="flex items-start gap-3 text-sm">
            <input id="notes" type="checkbox" class="mt-0.5 size-4 accent-accent" checked>
            <span><span class="font-medium">Space for notes</span><span class="block text-muted">Wide margins and open line spacing.</span></span>
          </label>
          <fieldset id="spacingBox" class="flex gap-6 pl-7 text-sm disabled:opacity-50">
            <legend class="sr-only">Line spacing for notes</legend>
            <label class="flex items-center gap-2"><input type="radio" name="line_spacing" value="1.5" class="size-4 accent-accent" checked>1.5 lines</label>
            <label class="flex items-center gap-2"><input type="radio" name="line_spacing" value="2" class="size-4 accent-accent">Double</label>
          </fieldset>
        </div>
        <label class="flex items-start gap-3 text-sm">
          <input id="colophon" type="checkbox" class="mt-0.5 size-4 accent-accent" checked>
          <span><span class="font-medium">Copyright notice</span><span class="block text-muted">At the end of each text.</span></span>
        </label>

        <details class="group/page border-t border-line pt-4">
          <summary class="heading flex cursor-pointer list-none items-center gap-2 text-xs [&::-webkit-details-marker]:hidden"><svg class="size-4 shrink-0 transition-transform group-open/page:rotate-90" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>Page</summary>
          <div class="mt-4 space-y-4">
            <div>
              <label for="paper" class="label">Paper</label>
              <select id="paper" class="input">
                <option value="a4">A4</option><option value="a5">A5</option>
                <option value="a6">A6</option><option value="us-letter">US Letter</option>
              </select>
            </div>
            <div>
              <label for="size" class="label">Font size (pt)</label>
              <input id="size" type="number" class="input" min="8" max="16" step="0.5" value="11">
            </div>
            <div>
              <label for="title" class="label">Title (empty = the passage reference)</label>
              <input id="title" type="text" class="input" maxlength="200">
            </div>
          </div>
        </details>
      </div>
    </details>
  </form>

  <!-- Preview. The view switch and the status float over it; on small screens it fills the width. -->
  <main class="flex min-h-0 min-w-0 flex-1 flex-col md:px-6 md:pt-6">
    <div class="relative min-h-0 flex-1 overflow-hidden bg-panel shadow-sm md:rounded-t-lg md:border md:border-b-0 md:border-line">
      <div id="status" role="status" aria-live="polite" class="absolute top-3 left-3 z-10 max-w-[calc(100%-9rem)] rounded-md bg-panel/90 px-2.5 py-1 text-sm text-ink italic shadow ring-1 ring-line empty:hidden [&.error]:font-semibold [&.error]:text-error [&.error]:not-italic"></div>
      <div class="absolute top-3 right-3 z-10 inline-flex rounded-md shadow-md" role="group" aria-label="Preview as">
        <button type="button" id="viewPage" aria-pressed="true" class="rounded-l-md cursor-pointer px-3 py-1.5 text-sm font-medium bg-panel text-ink ring-1 ring-line ring-inset hover:bg-field aria-pressed:bg-accent aria-pressed:text-accent-ink aria-pressed:ring-accent">Page</button>
        <button type="button" id="viewText" aria-pressed="false" class="rounded-r-md cursor-pointer px-3 py-1.5 text-sm font-medium bg-panel text-ink ring-1 ring-line ring-inset hover:bg-field aria-pressed:bg-accent aria-pressed:text-accent-ink aria-pressed:ring-accent">Text</button>
      </div>
      <div id="empty" class="grid h-full place-content-center p-8 text-center text-muted italic">
        <p class="max-w-sm">Choose a translation and a passage. The page appears here and follows every change.</p>
      </div>
      <div id="pages" aria-busy="false" hidden class="grid h-full content-start justify-items-center gap-4 overflow-auto bg-desk p-4 pt-16 transition-opacity aria-busy:opacity-50 max-md:pb-24"></div>
      <pre id="text" hidden class="h-full overflow-auto p-6 pt-16 font-serif text-base leading-7 whitespace-pre-wrap max-md:pb-24"></pre>
    </div>
  </main>

  <!-- Small screens: the download button stays at the bottom of the screen, over the preview -->
  <div class="pointer-events-none fixed inset-x-0 bottom-0 z-30 p-4 pb-[max(1rem,env(safe-area-inset-bottom))] md:hidden">
    <button type="button" id="downloadFloat" class="btn btn-primary pointer-events-auto w-full shadow-lg">Download PDF</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
// Tailwind classes for the elements built here. Keep them literal: the stylesheet is compiled by scanning this file.
const FIX_BUTTON = "btn btn-secondary mt-3 px-2.5 py-1.5 text-xs";
const PROBLEM_LIST = "list-disc space-y-1 pl-5";
const PAGE_IMAGE = "h-auto w-full max-w-2xl bg-white shadow-md ring-1 ring-ink/10";
const PAGE_NOTE = "text-center text-sm text-ink/70 italic";
const PICK_GROUP = "heading sticky top-0 border-b border-line bg-panel px-3 py-1.5 text-xs";
const PICK_OPTION = "cursor-pointer px-3 py-1.5 text-sm hover:bg-field aria-selected:font-semibold data-active:bg-accent data-active:text-accent-ink";
const PICK_NOTE = "px-3 py-2 text-sm text-muted italic";
const downloads = [$("download"), $("downloadFloat")];   // the sidebar button, and the one fixed to the screen on small ones
const outlines = {};   // translation id -> outline
const names = {};      // translation id -> display name
const bookNames = {};  // book code -> name, accumulated from every outline seen
let book = "";        // the chosen book lives here, not in the <select>: its options come and go

async function api(url, signal) {
  const res = await fetch(url, { signal });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const d = body.detail;
    // 429 usually comes from the proxy's rate limit and is not our JSON; 503 from us says "busy" itself.
    const busy = res.status === 429 ? "Too many requests. Wait a moment and try again." : null;
    throw new Error((Array.isArray(d) ? d.map((x) => x.msg).join("; ") : d) || busy || `Request failed (${res.status})`);
  }
  return res;
}
const getJson = async (url, signal) => (await api(url, signal)).json();
const outlineOf = async (id) => (outlines[id] ??= await getJson(`/api/translations/${id}/outline`));

function status(msg, isError = false) {
  $("status").textContent = msg;
  $("status").classList.toggle("error", isError);
}

/* ---- translation pickers: a combobox that lists translations in language sets ---- */
let catalog;   // every translation, fetched once, the first time a list is opened without a search
const everything = () => (catalog ??= (async () => {
  const all = [];
  for (let offset = 0; ; offset += 200) {
    const page = await getJson(`/api/translations?${new URLSearchParams({ limit: 200, offset })}`);
    all.push(...page);
    if (page.length < 200) return all;
  }
})().catch((e) => { catalog = undefined; throw e; }));

function byLanguage(items) {   // [[language, [translation, ...]], ...], both sorted by name
  const groups = new Map();
  for (const t of items) {
    const language = t.language || t.lang;
    groups.set(language, [...(groups.get(language) ?? []), t]);
  }
  return [...groups]
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([language, list]) => [language, list.sort((a, b) => a.name.localeCompare(b.name))]);
}

function picker(input, onChange) {
  const list = $(`${input.id}-list`);
  const labelOf = (t) => `${t.name} (${t.abbreviation})`;
  const note = (text) => Object.assign(document.createElement("p"), { className: PICK_NOTE, textContent: text });
  let id = "", label = "", active = -1, timer, latest = 0;
  const options = () => [...list.querySelectorAll("[role=option]")];

  function setOpen(on) {
    list.hidden = !on;
    input.setAttribute("aria-expanded", String(on));
    if (!on) { active = -1; input.removeAttribute("aria-activedescendant"); }
  }
  function highlight(i) {
    const opts = options();
    if (!opts.length) return;
    active = (i + opts.length) % opts.length;
    opts.forEach((o, n) => o.toggleAttribute("data-active", n === active));
    input.setAttribute("aria-activedescendant", opts[active].id);
    opts[active].scrollIntoView?.({ block: "nearest" });
  }
  function choose(t) {
    label = labelOf(t);
    input.value = label;
    setOpen(false);
    if (t.id !== id) { id = t.id; names[id] = t.name; onChange(); }
  }
  function render(items) {
    let n = 0;
    list.replaceChildren(...(items.length ? byLanguage(items).map(([language, ts]) => {
      const group = document.createElement("div");
      group.setAttribute("role", "group");
      group.setAttribute("aria-label", language);
      const head = Object.assign(document.createElement("div"), { className: PICK_GROUP, textContent: language });
      head.setAttribute("aria-hidden", "true");
      group.append(head, ...ts.map((t) => {
        const el = Object.assign(document.createElement("div"), { id: `${input.id}-option-${n++}`, className: PICK_OPTION });
        el.setAttribute("role", "option");
        el.setAttribute("aria-selected", String(t.id === id));
        el.append(`${t.name} `, Object.assign(document.createElement("span"), { className: "opacity-70", textContent: `(${t.abbreviation})` }));
        el.addEventListener("click", () => choose(t));
        return el;
      }));
      return group;
    }) : [note("No translations match.")]));
  }
  async function show(q) {   // no search text: everything, in language sets; otherwise the matches
    const mine = ++latest;
    setOpen(true);
    if (!list.firstChild) list.replaceChildren(note("Loading…"));
    let items;
    try {
      items = q ? await getJson(`/api/translations?${new URLSearchParams({ q, limit: 200 })}`) : await everything();
    } catch (e) {
      if (mine === latest) list.replaceChildren(note(e.message));
      return;
    }
    if (mine !== latest) return;
    render(items);
    list.removeAttribute("aria-busy");
    const chosenOne = options().findIndex((o) => o.getAttribute("aria-selected") === "true");
    highlight(q ? 0 : chosenOne);
  }
  function settle() {   // leaving the box: anything not chosen from the list goes back
    clearTimeout(timer);
    latest++;
    setOpen(false);
    if (input.value.trim() === "") {   // emptied on purpose: no translation here
      label = "";
      if (id) { id = ""; onChange(); }
    } else input.value = label;
  }

  input.addEventListener("focus", () => show(""));
  input.addEventListener("click", () => { if (list.hidden) show(""); });
  input.addEventListener("input", () => {
    clearTimeout(timer);
    list.setAttribute("aria-busy", "true");   // what is listed is for the previous text: not to be chosen yet
    active = -1;
    options().forEach((o) => o.removeAttribute("data-active"));
    const q = input.value.replace(/[()]/g, " ").trim();   // "King James Version (KJV)" must still match
    timer = setTimeout(() => show(q), q ? 180 : 0);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (list.hidden) show("");
      else highlight(e.key === "ArrowDown" ? active + 1 : active < 0 ? -1 : active - 1);
    } else if (e.key === "Enter" && !list.hidden) {
      e.preventDefault();   // choosing, not submitting
      if (!list.hasAttribute("aria-busy")) options()[active]?.click();
    } else if (e.key === "Escape" && !list.hidden) {
      e.stopPropagation();   // closes the list, not the drawer
      clearTimeout(timer);
      latest++;
      setOpen(false);
      input.value = label;
    }
  });
  list.addEventListener("mousedown", (e) => e.preventDefault());   // clicking an option keeps the box focused
  input.parentElement.addEventListener("focusout", (e) => {
    if (!input.parentElement.contains(e.relatedTarget)) settle();
  });

  return {
    get id() { return id; },
    async set(tid) {
      const t = await getJson(`/api/translations/${encodeURIComponent(tid)}`);
      id = t.id; names[id] = t.name;
      label = labelOf(t);
      input.value = label;
    },
  };
}

const p1 = picker($("t1"), () => refresh());
const p2 = picker($("t2"), () => refresh());
const chosen = () => [p1.id, p2.id].filter(Boolean);

/* ---- the passage is independent of the translation: switching translations never resets it ---- */
const num = (id) => ($(id).value === "" ? null : Number($(id).value));

/* ---- chapter and verse are selectors, listing what every chosen translation has ---- */
function limits() {
  const obs = chosen().map((id) => outlines[id]?.find((b) => b.code === book)).filter(Boolean);
  return {
    chapters: obs.length ? Math.min(...obs.map((o) => o.verses.length)) : 0,
    verses: (c) => (obs.length && c >= 1 ? Math.min(...obs.map((o) => o.verses[c - 1] ?? 0)) : 0),
  };
}

function put(id, value) {   // set a selector, adding the option if it is not listed (so it can be reported, not lost)
  const el = $(id), v = String(value);
  if (v !== "" && !Array.from(el.options).some((o) => o.value === v)) el.append(new Option(v, v));
  el.value = v;
}

function fillNumbers() {
  const { chapters, verses } = limits();
  const c1 = num("c1"), c2 = num("c2") ?? c1;
  const fill = (id, max, blank) => {
    const el = $(id), keep = el.value;
    const opts = Array.from({ length: max }, (_, i) => new Option(i + 1, i + 1));
    if (blank) opts.unshift(new Option(blank, ""));
    if (keep !== "" && Number(keep) > max) opts.push(new Option(keep, keep));   // out of range: kept, and reported
    el.replaceChildren(...opts);
    el.value = keep !== "" ? keep : blank ? "" : opts[0]?.value ?? "";
  };
  fill("c1", chapters);
  fill("v1", verses(c1));
  fill("c2", chapters, "same");
  fill("v2", verses(c2), "end");
}

function renumber(e) {   // a chapter changed: keep its verse inside the new chapter
  const { verses } = limits();
  const cap = (id, c) => { const m = verses(c); if (m && num(id) > m) put(id, m); };
  if (e.target.id === "c1") { cap("v1", num("c1")); if (num("c2") === null) cap("v2", num("c1")); }
  if (e.target.id === "c2") cap("v2", num("c2") ?? num("c1"));
  fillNumbers();
  check();
}

function problems() {
  const out = [];
  const c1 = num("c1"), v1 = num("v1") ?? 1, v2 = num("v2");
  const c2 = num("c2") ?? c1;
  if (!chosen().length) return ["Choose a translation."];
  if (!book) return ["Choose a book."];
  if (!c1) return ["Enter a starting chapter."];
  for (const id of chosen()) {
    const ob = outlines[id]?.find((b) => b.code === book);
    if (!ob) { out.push(`${names[id]} does not contain ${bookNames[book] ?? book}.`); continue; }
    const n = ob.verses.length, last = (c) => ob.verses[c - 1];
    if (c1 > n || c2 > n) { out.push(`${names[id]} has ${n} chapters of ${ob.name}.`); continue; }
    if (v1 > last(c1)) out.push(`${names[id]}: ${ob.name} ${c1} has ${last(c1)} verses, not ${v1}.`);
    if ((v2 ?? 0) > last(c2)) out.push(`${names[id]}: ${ob.name} ${c2} has ${last(c2)} verses, not ${v2}.`);
  }
  if (!out.length && (c2 < c1 || (c2 === c1 && v2 !== null && v2 < v1))) out.push("The range ends before it starts.");
  return out;
}

// Explicit user action only: clamp the passage to what every chosen translation contains.
function fit() {
  const obs = chosen().map((id) => outlines[id].find((b) => b.code === book));
  const n = Math.min(...obs.map((o) => o.verses.length));
  const last = (c) => Math.min(...obs.map((o) => o.verses[c - 1]));
  const c1 = Math.min(Math.max(num("c1") ?? 1, 1), n), c2 = Math.min(num("c2") ?? c1, n);
  put("c1", c1);
  put("v1", Math.min(num("v1") ?? 1, last(c1)));
  put("c2", c2 === c1 && $("c2").value === "" ? "" : c2);
  if (num("v2") !== null) put("v2", Math.min(num("v2"), last(c2)));
  fillNumbers();
  check();
}

function check() {
  $("spacingBox").disabled = !$("notes").checked;   // the spacing choice belongs to "Space for notes"
  const list = problems();
  const box = $("problems");
  box.hidden = !list.length;
  box.replaceChildren();
  if (list.length) {
    const ul = Object.assign(document.createElement("ul"), { className: PROBLEM_LIST });
    ul.append(...list.map((m) => Object.assign(document.createElement("li"), { textContent: m })));
    box.append(ul);
    const fixable = chosen().length && chosen().every((id) => outlines[id]?.some((b) => b.code === book));
    if (fixable && list.some((m) => /chapters|verses/.test(m))) {
      const b = Object.assign(document.createElement("button"), { type: "button", className: FIX_BUTTON, textContent: "Fit passage to these translations" });
      b.addEventListener("click", fit);
      box.append(b);
    }
  }
  for (const b of downloads) b.disabled = list.length > 0;
  saveState();
  if (list.length) { clearTimeout(timer); controller?.abort(); }   // keep the last good preview
  else schedule();
}

async function refresh() {
  if (!p1.id) return check();            // incomplete search text: leave everything as it is
  status("Loading…");
  try {
    await Promise.all(chosen().map(outlineOf));
  } catch (e) { return status(e.message, true); }
  status("");
  for (const id of chosen()) for (const b of outlines[id]) bookNames[b.code] = b.name;
  const keep = book;
  const books = outlines[p1.id];
  const options = books.map((b) => new Option(b.name, b.code));
  if (keep && !books.some((b) => b.code === keep))   // keep the chosen book, flagged, rather than reset it
    options.unshift(new Option(`${bookNames[keep] ?? keep} (not in this translation)`, keep));
  $("book").replaceChildren(...options);
  book = keep || books[0].code;
  $("book").value = book;
  fillNumbers();
  check();
}

function newBook() {                      // an explicit change of book starts the passage afresh
  book = $("book").value;
  put("c1", 1); put("v1", 1); put("c2", ""); put("v2", "");
  fillNumbers();
  check();
}

/* ---- state lives in the URL, so reloads and shared links keep the passage and options ---- */
const spacing = () => document.querySelector("input[name=line_spacing]:checked").value;
const FIELDS = ["c1", "v1", "c2", "v2", "paper", "size", "title"];
const TOGGLES = ["paragraphs", "poetry", "line_numbers", "notes", "colophon"];

function saveState() {
  const p = new URLSearchParams();
  if (p1.id) p.set("t1", p1.id);
  if (p2.id) p.set("t2", p2.id);
  if (book) p.set("book", book);
  for (const f of FIELDS) if ($(f).value) p.set(f, $(f).value);
  for (const f of TOGGLES) p.set(f, $(f).checked ? "1" : "0");
  p.set("line_spacing", spacing());
  history.replaceState(null, "", `?${p}`);
}

function query(format, download = false) {
  const p = new URLSearchParams();
  for (const id of chosen()) p.append("translation", id);
  p.set("book", book);
  p.set("c1", $("c1").value);
  p.set("v1", $("v1").value || 1);
  if ($("c2").value) p.set("c2", $("c2").value);
  if ($("v2").value) p.set("v2", $("v2").value);
  for (const f of ["paper", "size"]) p.set(f, $(f).value);
  if ($("title").value.trim()) p.set("title", $("title").value.trim());
  for (const f of TOGGLES) p.set(f, $(f).checked);
  p.set("line_spacing", spacing());
  p.set("format", format);
  if (download) p.set("download", "true");
  return p;
}

/* ---- live preview: debounced, and a newer request cancels the one still in flight ---- */
let view = "page", timer = null, controller = null, seq = 0;
const show = (which) => { for (const id of ["empty", "pages", "text"]) $(id).hidden = id !== which; };

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(update, 450);
}

async function update() {
  controller?.abort();
  controller = new AbortController();
  const { signal } = controller, mine = ++seq;
  $("pages").setAttribute("aria-busy", "true");
  status(view === "page" ? "Typesetting…" : "");
  try {
    if (view === "page") await showPages(signal, mine); else await showText(signal, mine);
    if (mine === seq) status("");
  } catch (e) {
    if (e.name !== "AbortError" && mine === seq) status(e.message, true);
  } finally {
    if (mine === seq) $("pages").setAttribute("aria-busy", "false");
  }
}

async function showPages(signal, mine) {
  const info = await getJson(`/api/preview?${query("pdf")}`, signal);
  const imgs = Array.from({ length: info.pages }, (_, i) =>
    Object.assign(new Image(), { src: `/api/preview/${info.key}/${i + 1}.png`, alt: `Page ${i + 1}`, className: PAGE_IMAGE }));
  await Promise.all(imgs.map((img) => img.decode?.().catch(() => {})));   // swap only once decoded: no flicker
  if (mine !== seq) return;
  const note = info.complete ? [] : [Object.assign(document.createElement("p"),
    { className: PAGE_NOTE, textContent: `Preview shows the first ${info.pages} pages. Download the PDF for the whole text.` })];
  $("pages").replaceChildren(...imgs, ...note);
  show("pages");
}

async function showText(signal, mine) {
  const res = await api(`/api/render?${query("txt")}`, signal);
  const body = await res.text();
  if (mine !== seq) return;
  $("text").textContent = body;
  show("text");
}

for (const [id, v] of [["viewPage", "page"], ["viewText", "text"]]) {
  $(id).addEventListener("click", () => {
    view = v;
    $("viewPage").setAttribute("aria-pressed", String(v === "page"));
    $("viewText").setAttribute("aria-pressed", String(v === "text"));
    if (!problems().length) update();
  });
}

$("form").addEventListener("submit", (e) => e.preventDefault());

async function download() {
  for (const b of downloads) b.disabled = true;
  status("Typesetting the PDF…");
  try {
    const res = await api(`/api/render?${query("pdf", true)}`);
    const name = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "")?.[1] || "passage.pdf";
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await res.blob()), download: name });
    a.click();
    URL.revokeObjectURL(a.href);
    status("");
  } catch (e) {
    status(e.message, true);
  } finally {
    check();
  }
}
for (const b of downloads) b.addEventListener("click", download);

/* ---- small screens: the form is a drawer ---- */
function drawer(open) {
  $("form").toggleAttribute("data-open", open);
  $("backdrop").hidden = !open;
  $("menu").setAttribute("aria-expanded", String(open));
  (open ? $("closeMenu") : $("menu")).focus();
}
$("menu").addEventListener("click", () => drawer(true));
$("closeMenu").addEventListener("click", () => drawer(false));
$("backdrop").addEventListener("click", () => drawer(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("form").hasAttribute("data-open")) drawer(false); });

$("book").addEventListener("change", newBook);
for (const f of ["c1", "c2"]) $(f).addEventListener("input", renumber);
for (const f of ["v1", "v2", "paper", "size", "title", ...TOGGLES]) $(f).addEventListener("input", check);
for (const r of document.querySelectorAll("input[name=line_spacing]")) r.addEventListener("input", check);

// What a first visit shows. Only a starting point: if the library lacks this translation, the
// first translation's first chapter is used instead.
const FIRST_VISIT = { t1: "eng-kjv2006", book: "GEN", c1: 1, v1: 1, c2: 2, v2: 3 };

(async function init() {
  const saved = new URLSearchParams(location.search);
  const firstVisit = !saved.has("t1") && !saved.has("book");
  book = saved.get("book") || "";
  if (firstVisit) {
    book = FIRST_VISIT.book;
    for (const f of ["c1", "v1", "c2", "v2"]) put(f, FIRST_VISIT[f]);
  }
  for (const f of FIELDS) if (saved.has(f)) (["c1", "v1", "c2", "v2"].includes(f) ? put : (id, v) => { $(id).value = v; })(f, saved.get(f));
  for (const f of TOGGLES) if (saved.has(f)) $(f).checked = saved.get(f) === "1";
  for (const r of document.querySelectorAll("input[name=line_spacing]")) r.checked = r.value === (saved.get("line_spacing") || "1.5");
  try {
    const [first] = await getJson("/api/translations?limit=1");
    for (const [p, key] of [[p1, "t1"], [p2, "t2"]]) {
      const id = saved.get(key) || (p === p1 && (firstVisit ? FIRST_VISIT.t1 : first?.id));
      if (!id) continue;
      try { await p.set(id); }
      catch {
        if (!(p === p1 && firstVisit && first)) continue;   // default translation not in this library
        await p.set(first.id);
        book = "";
        for (const f of ["c1", "v1"]) put(f, 1);
        for (const f of ["c2", "v2"]) put(f, "");
      }
    }
    if (!$("c1").value) { put("c1", 1); put("v1", 1); }
    await refresh();   // keeps a saved book even if this translation lacks it (flagged), defaults otherwise
  } catch (e) {
    status(e.message, true);
  }
})();
</script>
