<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuscript Discovery</title>
<style>
  /* Reading room by day: vellum, iron-gall ink, oxblood binding. By night: lamplit oak and brass. */
  :root {
    --desk: #c8b793;
    --panel: #ece1c9;
    --field: #f4ecd9;
    --ink: #2b2118;
    --muted: #6a5a45;
    --line: #b3a07a;
    --accent: #7a2e22;
    --accent-ink: #f6ecd6;
    --brass: #8f6a22;
    --error: #8f1d1d;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #15100b; --panel: #221a12; --field: #2b2118; --ink: #eadfc6; --muted: #a8977a;
      --line: #46392a; --accent: #c9a24b; --accent-ink: #1b140c; --brass: #c9a24b; --error: #e58b7e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.5 var(--serif); color: var(--ink); background: var(--desk); }
  .app { display: grid; grid-template-columns: 24rem 1fr; height: 100%; }
  form { background: var(--panel); border-right: 1px solid var(--line); padding: 1.6rem 1.5rem 2rem; overflow-y: auto; }
  header { margin-bottom: 1.5rem; padding-bottom: .9rem; border-bottom: 3px double var(--line); }
  h1 { font: 600 1.7rem/1.1 var(--serif); margin: 0; font-variant: small-caps; letter-spacing: .06em; }
  header p { margin: .35rem 0 0; color: var(--muted); font-style: italic; font-size: .95rem; }
  fieldset { border: 0; padding: 0; margin: 0 0 1.3rem; }
  legend { font: 600 .8rem/1 var(--serif); font-variant: small-caps; letter-spacing: .12em; color: var(--brass); padding: 0; margin-bottom: .6rem; }
  label { display: block; color: var(--muted); font-size: .88rem; margin: .65rem 0 .2rem; }
  select, input[type=number], input[type=text], input[type=search] {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 2px; padding: .45rem .55rem;
  }
  .range { display: grid; grid-template-columns: 3.2rem 1fr 1fr; gap: .5rem; align-items: end; }
  .range b { font: 600 .9rem var(--serif); color: var(--muted); padding-bottom: .55rem; }
  .range label { margin: 0 0 .2rem; font-size: .78rem; }
  .check { display: flex; gap: .6rem; align-items: baseline; color: var(--ink); margin: .5rem 0 0; font-size: .98rem; }
  .check small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.3; }
  .sub { display: flex; gap: 1.4rem; margin: .1rem 0 .3rem 1.55rem; padding: .1rem 0 .1rem .8rem; border: 0; border-left: 2px solid var(--brass); }
  .sub:disabled { opacity: .45; }
  .sub .check { margin: 0; font-size: .95rem; }
  .sub legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  details { margin-bottom: 1.3rem; }
  summary { cursor: pointer; font: 600 .8rem var(--serif); font-variant: small-caps; letter-spacing: .12em; color: var(--brass); }
  .actions { display: grid; gap: .5rem; }
  button { font: inherit; border-radius: 2px; padding: .6rem .9rem; cursor: pointer; border: 1px solid var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; letter-spacing: .02em; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--brass) 70%, transparent); outline-offset: 2px; }
  #problems { margin: 0 0 1rem; padding: .7rem .8rem; border: 1px solid var(--error); border-left-width: 4px; background: color-mix(in srgb, var(--error) 8%, var(--panel)); font-size: .92rem; }
  #problems ul { margin: 0 0 .5rem; padding-left: 1.1rem; }
  #problems button { padding: .35rem .7rem; font-size: .9rem; }
  main { display: flex; flex-direction: column; min-width: 0; padding: 1rem 1.4rem 1.4rem; gap: .6rem; }
  #status { min-height: 1.5rem; color: var(--panel); font-style: italic; }
  @media (prefers-color-scheme: dark) { #status { color: var(--muted); } }
  #status.error { color: #ffd9c9; font-style: normal; font-weight: 600; }
  .sheet { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 10px rgb(0 0 0 / .25); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .seg { display: inline-flex; }
  .seg button { padding: .3rem .9rem; font-size: .9rem; background: var(--panel); color: var(--ink); border-color: var(--line); }
  .seg button:first-child { border-radius: 2px 0 0 2px; }
  .seg button:last-child { border-radius: 0 2px 2px 0; margin-left: -1px; }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #pages { height: 100%; overflow: auto; padding: 1.2rem; display: grid; gap: 1.1rem; align-content: start; justify-items: center; background: var(--desk); transition: opacity .15s; }
  #pages[aria-busy=true] { opacity: .55; }
  #pages img { width: min(100%, 46rem); height: auto; background: #fff; box-shadow: 0 2px 8px rgb(0 0 0 / .35); }
  #pages .note { color: var(--panel); font-style: italic; margin: 0 0 .5rem; text-align: center; }
  @media (prefers-color-scheme: dark) { #pages .note { color: var(--muted); } }
  #text { margin: 0; height: 100%; overflow: auto; padding: 2rem clamp(1rem, 6vw, 5rem); font: 1.1rem/1.7 var(--serif); white-space: pre-wrap; }
  .empty { height: 100%; display: grid; place-content: center; text-align: center; color: var(--muted); padding: 2rem; }
  .empty p { max-width: 30rem; margin: 0; font: italic 1.2rem/1.5 var(--serif); }
  [hidden] { display: none !important; }
  @media (max-width: 52rem) {
    .app { grid-template-columns: 1fr; height: auto; }
    form { border-right: 0; border-bottom: 1px solid var(--line); }
    .sheet { min-height: 70vh; }
  }
</style>
</head>
<body>
<div class="app">
  <form id="form" autocomplete="off">
    <header>
      <h1>Manuscript Discovery</h1>
      <p>Any passage, set as a clean manuscript for study.</p>
    </header>

    <fieldset>
      <legend>Translation</legend>
      <label for="t1">Search by name, abbreviation or language</label>
      <input id="t1" type="search" placeholder="e.g. king james, greek, KJV" required>
      <label for="t2">Parallel translation (optional)</label>
      <input id="t2" type="search" placeholder="none">
    </fieldset>

    <fieldset>
      <legend>Passage</legend>
      <label for="book">Book</label>
      <select id="book"></select>
      <div class="range" style="margin-top:.8rem">
        <b>From</b>
        <div><label for="c1">Chapter</label><input id="c1" type="number" min="1" inputmode="numeric"></div>
        <div><label for="v1">Verse</label><input id="v1" type="number" min="1" inputmode="numeric"></div>
      </div>
      <div class="range" style="margin-top:.6rem">
        <b>To</b>
        <div><label for="c2">Chapter</label><input id="c2" type="number" min="1" inputmode="numeric" placeholder="same"></div>
        <div><label for="v2">Verse</label><input id="v2" type="number" min="1" inputmode="numeric" placeholder="end"></div>
      </div>
    </fieldset>

    <div id="problems" role="status" aria-live="polite" hidden></div>

    <fieldset>
      <legend>Manuscript</legend>
      <label class="check"><input id="paragraphs" type="checkbox"><span>Paragraph breaks<small>off: continuous text; on: where the translation marks them</small></span></label>
      <label class="check"><input id="poetry" type="checkbox" checked><span>Poetry lines<small>only where the translation marks them</small></span></label>
      <label class="check"><input id="line_numbers" type="checkbox" checked><span>Line numbers<small>restart each page; first translation only when parallel</small></span></label>
      <label class="check"><input id="notes" type="checkbox" checked><span>Space for notes<small>wide margins and open line spacing</small></span></label>
      <fieldset class="sub" id="spacingBox">
        <legend>Line spacing for notes</legend>
        <label class="check"><input type="radio" name="line_spacing" value="1.5" checked><span>1.5 lines</span></label>
        <label class="check"><input type="radio" name="line_spacing" value="2"><span>Double</span></label>
      </fieldset>
      <label class="check"><input id="colophon" type="checkbox" checked><span>Copyright notice<small>at the end of each text</small></span></label>
    </fieldset>

    <details>
      <summary>Page</summary>
      <label for="paper">Paper</label>
      <select id="paper">
        <option value="a4">A4</option><option value="a5">A5</option>
        <option value="a6">A6</option><option value="us-letter">US Letter</option>
      </select>
      <label for="size">Font size (pt)</label>
      <input id="size" type="number" min="8" max="16" step="0.5" value="11">
      <label for="title">Title (empty = the passage reference)</label>
      <input id="title" type="text" maxlength="200">
    </details>

    <div class="actions">
      <button class="primary" type="button" id="download">Download PDF</button>
    </div>
  </form>

  <main>
    <div class="bar">
      <div id="status" role="status" aria-live="polite"></div>
      <div class="seg" role="group" aria-label="Preview as">
        <button type="button" id="viewPage" aria-pressed="true">Page</button>
        <button type="button" id="viewText" aria-pressed="false">Text</button>
      </div>
    </div>
    <div class="sheet">
      <div class="empty" id="empty"><p>Choose a translation and a passage. The page appears here and follows every change.</p></div>
      <div id="pages" aria-busy="false" hidden></div>
      <pre id="text" hidden></pre>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const outlines = {};   // translation id -> outline
const names = {};      // translation id -> display name
const bookNames = {};  // book code -> name, accumulated from every outline seen
let book = "";        // the chosen book lives here, not in the <select>: its options come and go

async function api(url, signal) {
  const res = await fetch(url, { signal });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const d = body.detail;
    throw new Error((Array.isArray(d) ? d.map((x) => x.msg).join("; ") : d) || `Request failed (${res.status})`);
  }
  return res;
}
const getJson = async (url, signal) => (await api(url, signal)).json();
const outlineOf = async (id) => (outlines[id] ??= await getJson(`/api/translations/${id}/outline`));

function status(msg, isError = false) {
  $("status").textContent = msg;
  $("status").classList.toggle("error", isError);
}

/* ---- searchable translation pickers (thousands of translations: never one big <select>) ---- */
function picker(input, onChange) {
  const list = document.createElement("datalist");
  list.id = `${input.id}-list`;
  input.setAttribute("list", list.id);
  input.after(list);
  const known = new Map();   // every label ever seen -> translation; never cleared, so a chosen label always resolves
  const label = (t) => `${t.name} (${t.abbreviation})`;
  let id = "", timer;

  async function load(q) {
    const items = await getJson(`/api/translations?${new URLSearchParams({ q, limit: 50 })}`);
    list.replaceChildren(...items.map((t) => {
      known.set(label(t), t);
      return Object.assign(document.createElement("option"), { value: label(t) });
    }));
    return items;
  }
  input.addEventListener("input", () => {
    clearTimeout(timer);
    if (!known.has(input.value))   // a complete label needs no new search
      timer = setTimeout(() => load(input.value.trim()).catch(() => {}), 180);
    const t = known.get(input.value);
    if ((t?.id ?? "") !== id) {
      id = t?.id ?? "";
      if (t) names[id] = t.name;
      onChange();
    }
  });
  return {
    get id() { return id; },
    load,
    async set(tid) {
      const t = await getJson(`/api/translations/${encodeURIComponent(tid)}`);
      id = t.id; names[id] = t.name;
      input.value = label(t);
      known.set(label(t), t);
    },
  };
}

const p1 = picker($("t1"), () => refresh());
const p2 = picker($("t2"), () => refresh());
const chosen = () => [p1.id, p2.id].filter(Boolean);

/* ---- the passage is independent of the translation: switching translations never resets it ---- */
const num = (id) => ($(id).value === "" ? null : Number($(id).value));

function problems() {
  const out = [];
  const c1 = num("c1"), v1 = num("v1") ?? 1, v2 = num("v2");
  const c2 = num("c2") ?? c1;
  if (!chosen().length) return ["Choose a translation."];
  if (!book) return ["Choose a book."];
  if (!c1) return ["Enter a starting chapter."];
  for (const id of chosen()) {
    const ob = outlines[id]?.find((b) => b.code === book);
    if (!ob) { out.push(`${names[id]} does not contain ${bookNames[book] ?? book}.`); continue; }
    const n = ob.verses.length, last = (c) => ob.verses[c - 1];
    if (c1 > n || c2 > n) { out.push(`${names[id]} has ${n} chapters of ${ob.name}.`); continue; }
    if (v1 > last(c1)) out.push(`${names[id]}: ${ob.name} ${c1} has ${last(c1)} verses, not ${v1}.`);
    if ((v2 ?? 0) > last(c2)) out.push(`${names[id]}: ${ob.name} ${c2} has ${last(c2)} verses, not ${v2}.`);
  }
  if (!out.length && (c2 < c1 || (c2 === c1 && v2 !== null && v2 < v1))) out.push("The range ends before it starts.");
  return out;
}

// Explicit user action only: clamp the passage to what every chosen translation contains.
function fit() {
  const obs = chosen().map((id) => outlines[id].find((b) => b.code === book));
  const n = Math.min(...obs.map((o) => o.verses.length));
  const last = (c) => Math.min(...obs.map((o) => o.verses[c - 1]));
  const c1 = Math.min(Math.max(num("c1") ?? 1, 1), n), c2 = Math.min(num("c2") ?? c1, n);
  $("c1").value = c1;
  $("v1").value = Math.min(num("v1") ?? 1, last(c1));
  $("c2").value = c2 === c1 && $("c2").value === "" ? "" : c2;
  if (num("v2") !== null) $("v2").value = Math.min(num("v2"), last(c2));
  check();
}

function check() {
  $("spacingBox").disabled = !$("notes").checked;   // the spacing choice belongs to "Space for notes"
  const list = problems();
  const box = $("problems");
  box.hidden = !list.length;
  box.replaceChildren();
  if (list.length) {
    const ul = document.createElement("ul");
    ul.append(...list.map((m) => Object.assign(document.createElement("li"), { textContent: m })));
    box.append(ul);
    const fixable = chosen().length && chosen().every((id) => outlines[id]?.some((b) => b.code === book));
    if (fixable && list.some((m) => /chapters|verses/.test(m))) {
      const b = Object.assign(document.createElement("button"), { type: "button", className: "secondary", textContent: "Fit passage to these translations" });
      b.addEventListener("click", fit);
      box.append(b);
    }
  }
  $("download").disabled = list.length > 0;
  saveState();
  if (list.length) { clearTimeout(timer); controller?.abort(); }   // keep the last good preview
  else schedule();
}

async function refresh() {
  if (!p1.id) return check();            // incomplete search text: leave everything as it is
  status("Loading…");
  try {
    await Promise.all(chosen().map(outlineOf));
  } catch (e) { return status(e.message, true); }
  status("");
  for (const id of chosen()) for (const b of outlines[id]) bookNames[b.code] = b.name;
  const keep = book;
  const books = outlines[p1.id];
  const options = books.map((b) => new Option(b.name, b.code));
  if (keep && !books.some((b) => b.code === keep))   // keep the chosen book, flagged, rather than reset it
    options.unshift(new Option(`${bookNames[keep] ?? keep} (not in this translation)`, keep));
  $("book").replaceChildren(...options);
  book = keep || books[0].code;
  $("book").value = book;
  check();
}

function newBook() {                      // an explicit change of book starts the passage afresh
  book = $("book").value;
  $("c1").value = 1; $("v1").value = 1; $("c2").value = ""; $("v2").value = "";
  check();
}

/* ---- state lives in the URL, so reloads and shared links keep the passage and options ---- */
const spacing = () => document.querySelector("input[name=line_spacing]:checked").value;
const FIELDS = ["c1", "v1", "c2", "v2", "paper", "size", "title"];
const TOGGLES = ["paragraphs", "poetry", "line_numbers", "notes", "colophon"];

function saveState() {
  const p = new URLSearchParams();
  if (p1.id) p.set("t1", p1.id);
  if (p2.id) p.set("t2", p2.id);
  if (book) p.set("book", book);
  for (const f of FIELDS) if ($(f).value) p.set(f, $(f).value);
  for (const f of TOGGLES) p.set(f, $(f).checked ? "1" : "0");
  p.set("line_spacing", spacing());
  history.replaceState(null, "", `?${p}`);
}

function query(format, download = false) {
  const p = new URLSearchParams();
  for (const id of chosen()) p.append("translation", id);
  p.set("book", book);
  p.set("c1", $("c1").value);
  p.set("v1", $("v1").value || 1);
  if ($("c2").value) p.set("c2", $("c2").value);
  if ($("v2").value) p.set("v2", $("v2").value);
  for (const f of ["paper", "size"]) p.set(f, $(f).value);
  if ($("title").value.trim()) p.set("title", $("title").value.trim());
  for (const f of TOGGLES) p.set(f, $(f).checked);
  p.set("line_spacing", spacing());
  p.set("format", format);
  if (download) p.set("download", "true");
  return p;
}

/* ---- live preview: debounced, and a newer request cancels the one still in flight ---- */
let view = "page", timer = null, controller = null, seq = 0;
const show = (which) => { for (const id of ["empty", "pages", "text"]) $(id).hidden = id !== which; };

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(update, 450);
}

async function update() {
  controller?.abort();
  controller = new AbortController();
  const { signal } = controller, mine = ++seq;
  $("pages").setAttribute("aria-busy", "true");
  status(view === "page" ? "Typesetting…" : "");
  try {
    if (view === "page") await showPages(signal, mine); else await showText(signal, mine);
    if (mine === seq) status("");
  } catch (e) {
    if (e.name !== "AbortError" && mine === seq) status(e.message, true);
  } finally {
    if (mine === seq) $("pages").setAttribute("aria-busy", "false");
  }
}

async function showPages(signal, mine) {
  const info = await getJson(`/api/preview?${query("pdf")}`, signal);
  const imgs = Array.from({ length: info.pages }, (_, i) =>
    Object.assign(new Image(), { src: `/api/preview/${info.key}/${i + 1}.png`, alt: `Page ${i + 1}` }));
  await Promise.all(imgs.map((img) => img.decode?.().catch(() => {})));   // swap only once decoded: no flicker
  if (mine !== seq) return;
  const note = info.complete ? [] : [Object.assign(document.createElement("p"),
    { className: "note", textContent: `Preview shows the first ${info.pages} pages. Download the PDF for the whole text.` })];
  $("pages").replaceChildren(...imgs, ...note);
  show("pages");
}

async function showText(signal, mine) {
  const res = await api(`/api/render?${query("txt")}`, signal);
  const body = await res.text();
  if (mine !== seq) return;
  $("text").textContent = body;
  show("text");
}

for (const [id, v] of [["viewPage", "page"], ["viewText", "text"]]) {
  $(id).addEventListener("click", () => {
    view = v;
    $("viewPage").setAttribute("aria-pressed", String(v === "page"));
    $("viewText").setAttribute("aria-pressed", String(v === "text"));
    if (!problems().length) update();
  });
}

$("form").addEventListener("submit", (e) => e.preventDefault());

$("download").addEventListener("click", async () => {
  $("download").disabled = true;
  status("Typesetting the PDF…");
  try {
    const res = await api(`/api/render?${query("pdf", true)}`);
    const name = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "")?.[1] || "passage.pdf";
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await res.blob()), download: name });
    a.click();
    URL.revokeObjectURL(a.href);
    status("");
  } catch (e) {
    status(e.message, true);
  } finally {
    check();
  }
});

$("book").addEventListener("change", newBook);
for (const f of ["c1", "v1", "c2", "v2", "paper", "size", "title", ...TOGGLES]) $(f).addEventListener("input", check);
for (const r of document.querySelectorAll("input[name=line_spacing]")) r.addEventListener("input", check);

// What a first visit shows. Only a starting point: if the library lacks this translation, the
// first translation's first chapter is used instead.
const FIRST_VISIT = { t1: "eng-kjv2006", book: "GEN", c1: 1, v1: 1, c2: 2, v2: 3 };

(async function init() {
  const saved = new URLSearchParams(location.search);
  const firstVisit = !saved.has("t1") && !saved.has("book");
  book = saved.get("book") || "";
  if (firstVisit) {
    book = FIRST_VISIT.book;
    for (const f of ["c1", "v1", "c2", "v2"]) $(f).value = FIRST_VISIT[f];
  }
  for (const f of FIELDS) if (saved.has(f)) $(f).value = saved.get(f);
  for (const f of TOGGLES) if (saved.has(f)) $(f).checked = saved.get(f) === "1";
  for (const r of document.querySelectorAll("input[name=line_spacing]")) r.checked = r.value === (saved.get("line_spacing") || "1.5");
  try {
    const first = (await p1.load(""))[0];
    for (const [p, key] of [[p1, "t1"], [p2, "t2"]]) {
      const id = saved.get(key) || (p === p1 && (firstVisit ? FIRST_VISIT.t1 : first?.id));
      if (!id) continue;
      try { await p.set(id); }
      catch {
        if (!(p === p1 && firstVisit && first)) continue;   // default translation not in this library
        await p.set(first.id);
        book = "";
        for (const f of ["c1", "v1"]) $(f).value = 1;
        for (const f of ["c2", "v2"]) $(f).value = "";
      }
    }
    if (!$("c1").value) { $("c1").value = 1; $("v1").value = 1; }
    await refresh();   // keeps a saved book even if this translation lacks it (flagged), defaults otherwise
  } catch (e) {
    status(e.message, true);
  }
})();
</script>
</body>
</html>
