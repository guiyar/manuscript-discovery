[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manuscript-discovery"
version = "0.1.0"
description = "Set any passage of eBible.org texts as a clean manuscript for study, with optional parallel columns"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "defusedxml", "pycountry", "cachetools"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
manuscript-discovery = "manuscript_discovery.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manuscript_discovery"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ui: browser-less UI tests (Node + jsdom); run with `npm ci` done in tests/ui"]
